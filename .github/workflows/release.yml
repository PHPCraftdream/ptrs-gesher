name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag version, without v'
        required: true
        type: string
      source_sha:
        description: 'Full 40-character commit SHA of the original release tag'
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  source:
    name: Resolve immutable release source
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify original tag and SHA
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version="$INPUT_VERSION"
            sha="$INPUT_SHA"
          else
            version="${GITHUB_REF_NAME#v}"
            sha="$(git rev-parse "$GITHUB_SHA^{commit}")"
          fi
          python3 .github/scripts/release_source.py resolve --version "$version" --source-sha "$sha"

  checks:
    name: Release checks
    needs: source
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    env:
      RELEASE_VERSION: ${{ needs.source.outputs.version }}
      RELEASE_SHA: ${{ needs.source.outputs.sha }}
    steps:
      # Workflow fixes may come from the dispatch ref; package sources may not.
      - uses: actions/checkout@v4
        with:
          path: automation
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: source
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.89
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: source/tools/interop/go/go.sum
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source
      - uses: taiki-e/install-action@v2
        with:
          tools: cargo-semver-checks,cargo-deny
      - name: Verify source and versions
        run: python3 ../automation/.github/scripts/release_source.py verify --version "$RELEASE_VERSION" --source-sha "$RELEASE_SHA"
      - name: Validate release tooling
        working-directory: automation
        run: python3 -m unittest discover -s .github/scripts/tests -v
      - name: Run local release gates against pinned source
        run: python3 ../automation/.github/scripts/release-check.py --root "$PWD"

  publish:
    name: Publish pinned release
    needs: [source, checks]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: publish-${{ needs.source.outputs.version }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: source
    env:
      RELEASE_VERSION: ${{ needs.source.outputs.version }}
      RELEASE_SHA: ${{ needs.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: automation
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: source
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source
      - name: Reject mismatched partial releases before any upload
        run: python3 ../automation/.github/scripts/publish.py check-existing --version "$RELEASE_VERSION" --source-sha "$RELEASE_SHA"
      - name: Authenticate core
        id: auth-core
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish core
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-core.outputs.token }}
        run: python3 ../automation/.github/scripts/publish.py ptrs-gesher-core --version "$RELEASE_VERSION" --source-sha "$RELEASE_SHA"
      - name: Authenticate bridge-line
        id: auth-bridge-line
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish bridge-line
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-bridge-line.outputs.token }}
        run: python3 ../automation/.github/scripts/publish.py ptrs-gesher-bridge-line --version "$RELEASE_VERSION" --source-sha "$RELEASE_SHA"
      - name: Authenticate obfs4
        id: auth-obfs4
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish obfs4
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-obfs4.outputs.token }}
        run: python3 ../automation/.github/scripts/publish.py ptrs-gesher-obfs4 --version "$RELEASE_VERSION" --source-sha "$RELEASE_SHA"
      - name: Authenticate webtunnel
        id: auth-webtunnel
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish webtunnel
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-webtunnel.outputs.token }}
        run: python3 ../automation/.github/scripts/publish.py ptrs-gesher-webtunnel --version "$RELEASE_VERSION" --source-sha "$RELEASE_SHA"
      - name: Authenticate lyrebird
        id: auth-lyrebird
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish lyrebird
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-lyrebird.outputs.token }}
        run: python3 ../automation/.github/scripts/publish.py ptrs-gesher-lyrebird --version "$RELEASE_VERSION" --source-sha "$RELEASE_SHA"
      - name: Authenticate umbrella
        id: auth-umbrella
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish umbrella
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-umbrella.outputs.token }}
        run: python3 ../automation/.github/scripts/publish.py ptrs-gesher --version "$RELEASE_VERSION" --source-sha "$RELEASE_SHA"
