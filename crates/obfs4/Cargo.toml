[package]
name = "ptrs-gesher-obfs4"
version = "0.10.0"
edition = "2021"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
description = "obfs4 pluggable transport implementation (ptrs-gesher framework)"
keywords = ["tor", "networking", "censorship", "circumvention", "pluggable-transport"]
categories = ["network-programming", "cryptography"]
repository = "https://github.com/PHPCraftdream/ptrs-gesher"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
debug = ["ptrs/debug"]

[lib]
name = "obfs4"
crate-type = ["rlib"]

[dependencies]
## Local
ptrs = { package = "ptrs-gesher-core", path = "../core", version = "0.10.0" }

## PRNG
getrandom = "0.4.3"
rand = "0.10.3"
rand_core = "0.10.1"

## Crypto
digest = { version = "0.11.3", features = ["mac"] }
siphasher = "1.0.0"
sha2 = "0.11.1"
shake = "0.1.0"
hmac = { version = "0.13.0", features = ["zeroize"] }
hkdf = "0.13.0"
# NaCl secretbox (XSalsa20-Poly1305) is assembled in common::secretbox:
# crypto_secretbox has no stable release on cipher 0.5.
salsa20 = { version = "0.11.0", features = ["zeroize"] }
poly1305 = { version = "0.9.1", features = ["zeroize"] }
subtle = "2.5.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "getrandom", "reusable_secrets"] }

## Utils
hex = "0.4.3"
tracing = "0.1.40"
colored = "2.0.4"
base64 = "0.23.1"
serde_json = "1.0.114"
serde = "1.0.197"
tempfile = "3.10.1"

## Networking tools
pin-project = "1.1.3"
futures = "0.3.29"
tokio = { version = "1.34", features = ["io-util", "rt-multi-thread", "net", "rt", "macros", "sync", "signal", "time", "fs"] }
tokio-util = { version = "0.7.10", features = ["codec", "io"]}
bytes = "1.5.0"

## ntor_arti
tor-cell = "0.48.0"
tor-llcrypto = "0.48.0"
tor-error = "0.48.0"
tor-bytes = "0.48.0"
zeroize = "1.7.0"
thiserror = "2.0.6"

## Pinned to keep transitive resolution from selecting versions that are
## too low (anything below the exact version here breaks the build).
curve25519-elligator2 = { version="0.1.0-alpha.1", features=["elligator2"] }

## Maybe useful in future iterations
# tor-socksproto = { version = "0.10.0" }
# arti-client = { package = "arti-client", version = "0.14.0", default-features = false }
# tor-ptmgr = "0.11.0"

[dev-dependencies]
tracing-subscriber = "0.3.18"
hex-literal = "0.4.1"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
sha2 = "0.11.1"
hmac = { version = "0.13.0", features = ["zeroize"] }
bytes = "1.5.0"
proptest = "1"
tokio = { version = "1.34", features = ["test-util"] }

[[bench]]
name = "obfs4_bench"
harness = false

[[bench]]
name = "throughput_bench"
harness = false

[lints.rust]
# unexpected_cfgs are used to disable incomplete / WIP features and tests. This is
# not an error for this library. This turns off that specific lint for the "disable" feature.
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_features, values("disabled"))'] }
