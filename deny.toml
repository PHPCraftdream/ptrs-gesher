[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "Unlicense",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[advisories]
yanked = "deny"
unmaintained = "all"
# Transitive dependencies count too, so an unmaintained crate anywhere in the
# tree fails the check instead of only surfacing in downstream trees.
ignore = [
    # rsa 0.9.10 (Marvin Attack) is pulled in by tor-llcrypto 0.48; we don't
    # use RSA directly and no fixed rsa release exists yet.
    { id = "RUSTSEC-2023-0071", reason = "rsa via tor-llcrypto, RSA unused here, no fixed release" },
    # paste 1.0.15 (unmaintained) is a proc-macro used by tor-basic-utils,
    # tor-cell, tor-error and other tor-* crates at compile time only.
    { id = "RUSTSEC-2024-0436", reason = "paste via tor-* crates, compile-time macro only" },
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
